# Explicit project name so `down`/`up` always hit the same stack, even when
# the compose file is invoked from different paths (CI used to flip between
# /opt/debridgers/docker-compose.yml and deploy/docker-compose.prod.yml).
name: debridgers

services:
  debridgers-backend:
    image: 1techhunter/debridgers:${IMAGE_TAG:-develop}
    container_name: debridgers-backend
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "4002:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: 
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: debridgers-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_CREDENTIALS}
    environment:
      - CLOUDFLARE_TUNNEL_CREDENTIALS=${CLOUDFLARE_TUNNEL_CREDENTIALS}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
