# One compose file for both stacks on a single VPS.
# DEPLOY_ENV and HOST_PORT come from deploy.sh (dev → 4001, prod → 4002).
name: debridgers-${DEPLOY_ENV:-prod}

services:
  debridgers-backend:
    image: 1techhunter/debridgers:${IMAGE_TAG:-develop}
    container_name: debridgers-backend-${DEPLOY_ENV:-prod}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4001}:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
