name: Deploy Debridgers

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/debridgers-backend/**'
      - 'packages/**'
      - 'libs/**'
      - 'docker/backend.Dockerfile'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: 1techhunter/debridgers

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend.Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file, deploy script, and tunnel config
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "install -m 600 -o 65532 -g 65532 /dev/stdin /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Docker Hub on target VPS
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin" <<< "$DOCKERHUB_TOKEN"

      - name: Run deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${{ needs.build-and-push.outputs.image_tag }}"

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file, deploy script, and tunnel config
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "install -m 600 -o 65532 -g 65532 /dev/stdin /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Docker Hub on target VPS
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin" <<< "$DOCKERHUB_TOKEN"

      - name: Run deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${{ needs.build-and-push.outputs.image_tag }}"
