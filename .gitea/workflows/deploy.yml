name: CI/CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/debridgers-backend/**'
      - 'packages/**'
      - 'deploy/**'
      - '.gitea/workflows/deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: code.codeberg.org
  IMAGE_NAME: DEBRIDGERS_LTD/debridgers-backend

jobs:
  lint:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: codeberg-small
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    runs-on: codeberg-small
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: debridgers
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:backend

      # - name: Run E2E tests
      #   env:
      #     NODE_ENV: test
      #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/debridgers
      #     UPSTASH_REDIS_URL: redis://redis:6379
      #     PORT: "4000"
      #     ALLOWED_ORIGINS: "http://localhost:5173"
      #     ADMIN_EMAIL: admin@debridgers.com
      #     ADMIN_PASSWORD: "Admin@2026!"
      #     ACCESS_TOKEN_SECRET: ci-access-token-secret
      #     REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      #     REQUEST_KEY: ci-request-key
      #     ADMIN_KEY_1: ci-admin-key-1
      #     ADMIN_KEY_2: ci-admin-key-2
      #     PAYMENT_KEY_1: ci-payment-key-1
      #     PAYMENT_KEY_2: ci-payment-key-2
      #     PAYSTACK_SECRET_KEY: ""
      #   run: pnpm test:e2e

  build-and-push:
    needs: [build, test]
    runs-on: codeberg-small
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Kaniko auth
        run: |
          mkdir -p $HOME/.kaniko
          echo '{
            "auths": {
              "${{ env.REGISTRY }}": {
                "username": "${{ github.actor }}",
                "password": "${{ secrets.CODEBERG_TOKEN }}"
              }
            }
          }' > $HOME/.kaniko/config.json

      - name: Download and run Kaniko
        run: |
          wget -q -O /tmp/kaniko https://github.com/GoogleContainerTools/kaniko/releases/download/v1.23.0/executor-linux-amd64 || \
          curl -L -o /tmp/kaniko https://github.com/GoogleContainerTools/kaniko/releases/download/v1.23.0/executor-linux-amd64
          chmod +x /tmp/kaniko
          /tmp/kaniko \
            --dockerfile=./docker/backend.Dockerfile \
            --context=. \
            --destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            --destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }} \
            --target=prod
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: codeberg-small
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy files
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "install -m 600 -o 65532 -g 65532 /dev/stdin /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Codeberg Container Registry on target VPS
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin" <<< "$CODEBERG_TOKEN"

      - name: Run deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${{ needs.build-and-push.outputs.image_tag }}"

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: codeberg-small
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy files
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "install -m 600 -o 65532 -g 65532 /dev/stdin /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Codeberg Container Registry on target VPS
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin" <<< "$CODEBERG_TOKEN"

      - name: Run deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${{ needs.build-and-push.outputs.image_tag }}"
