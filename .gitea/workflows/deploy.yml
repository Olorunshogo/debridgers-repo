# Manual full-stack CI + backend VPS deploy.
# Push-triggered work lives in backend.yml and frontend.yml so one commit
# does not run this workflow and those in parallel.
name: CI/CD (manual)

on:
  workflow_dispatch: {}

env:
  REGISTRY: docker.io
  IMAGE_NAME: 1techhunter/debridgers

jobs:
  lint:
    runs-on: codeberg-small
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: codeberg-small
    needs: lint
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    runs-on: codeberg-small
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:backend

  deploy-dev:
    needs: [build, test]
    if: github.ref == 'refs/heads/develop'
    runs-on: codeberg-small
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (build + push + deploy)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE_DEV }}
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="develop"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/dev /opt/debridgers/cloudflared"
          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            rm -rf apps packages libs docker
            tar -xzf /tmp/code.tar.gz
            rm -f /tmp/code.tar.gz"

          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/dev/docker-compose.yml
          scp deploy/docker-compose.tunnel.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.tunnel.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers/dev
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin" <<< "$DOCKERHUB_TOKEN"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            IMAGE_SHA='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}'
            IMAGE_BRANCH='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG}'
            docker build --target=prod \
              -t \"\$IMAGE_SHA\" \
              -t \"\$IMAGE_BRANCH\" \
              -f ./docker/backend.Dockerfile .
            chmod +x /opt/debridgers/deploy.sh
            /opt/debridgers/deploy.sh ${SHORT_SHA} dev
            docker push \"\$IMAGE_SHA\"
            docker push \"\$IMAGE_BRANCH\""

  deploy-production:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: codeberg-small
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (build + push + deploy)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE_PROD }}
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="latest"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/prod /opt/debridgers/cloudflared"
          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            rm -rf apps packages libs docker
            tar -xzf /tmp/code.tar.gz
            rm -f /tmp/code.tar.gz"

          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/prod/docker-compose.yml
          scp deploy/docker-compose.tunnel.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.tunnel.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers/prod
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin" <<< "$DOCKERHUB_TOKEN"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            IMAGE_SHA='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}'
            IMAGE_BRANCH='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG}'
            docker build --target=prod \
              -t \"\$IMAGE_SHA\" \
              -t \"\$IMAGE_BRANCH\" \
              -f ./docker/backend.Dockerfile .
            chmod +x /opt/debridgers/deploy.sh
            /opt/debridgers/deploy.sh ${SHORT_SHA} prod
            docker push \"\$IMAGE_SHA\"
            docker push \"\$IMAGE_BRANCH\""
