name: CI/CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/debridgers-backend/**'
      - 'packages/**'
      - 'deploy/**'
      - '.gitea/workflows/deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: codeberg.org
  IMAGE_NAME: debridgers_ltd/debridgers-backend

jobs:
  lint:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: codeberg-small
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    runs-on: codeberg-small
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:backend

  deploy-dev:
    needs: [build, test]
    if: github.ref == 'refs/heads/develop'
    runs-on: codeberg-small
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy files and source code
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml
          # Copy source code needed for Docker build
          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/debridgers && tar -xzf /tmp/code.tar.gz && rm -f /tmp/code.tar.gz"

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Codeberg Container Registry on target VPS
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login ${{ env.REGISTRY }} -u $CODEBERG_USERNAME --password-stdin" <<< "$CODEBERG_TOKEN"

      - name: Run deploy
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${SHORT_SHA}"

  deploy-production:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: codeberg-small
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy files and source code
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          scp deploy/docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.yml
          scp deploy/deploy.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml
          # Copy source code needed for Docker build
          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/debridgers && tar -xzf /tmp/code.tar.gz && rm -f /tmp/code.tar.gz"

      - name: Install app environment on target VPS
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is empty — refusing to overwrite /opt/debridgers/.env" >&2
            exit 1
          fi
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -eu
            cd /opt/debridgers
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo "incoming env is empty — refusing to replace .env" >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env ".env.bak.$(date +%s)"
              for k in IMAGE_TAG; do
                grep -h "^${k}=" .env >> .env.incoming || true
              done
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          ' <<< "$ENV_FILE"

      - name: Install tunnel credentials on target VPS
        env:
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/debridgers/cloudflared"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" <<< "$TUNNEL_CREDENTIALS"

      - name: Login to Codeberg Container Registry on target VPS
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login ${{ env.REGISTRY }} -u $CODEBERG_USERNAME --password-stdin" <<< "$CODEBERG_TOKEN"

      - name: Run deploy
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod +x /opt/debridgers/deploy.sh && /opt/debridgers/deploy.sh ${SHORT_SHA}"
