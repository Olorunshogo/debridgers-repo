# Backend only: lint/typecheck/build the API, then deploy the Docker image on the VPS.
# Frontend apps are handled by frontend.yml.
#
# One VPS, two stacks (different Neon DATABASE_URL per Codeberg environment secret):
#   develop  → /opt/debridgers/dev  :4001  api-test.debridgers.com
#   main     → /opt/debridgers/prod :4002  api.debridgers.com
name: Backend

on:
  push:
    branches:
      - develop 
      - main
    paths:
      - "apps/debridgers-backend/**"
      - "packages/pricing/**"
      - "packages/ratings/**"
      - "packages/api-client/**"
      - "libs/**"
      - "deploy/**"
      - "docker/backend.Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - ".gitea/workflows/backend.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: 1techhunter/debridgers
  PNPM_VERSION: "10.32.1"

jobs:
  lint:
    runs-on: codeberg-small
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm lint:backend

      - name: Typecheck backend
        run: pnpm typecheck:backend

  build:
    runs-on: codeberg-small
    needs: lint
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:backend

  deploy-dev:
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    runs-on: codeberg-small
    environment: dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy dev stack to VPS
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE_DEV }}
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="develop"
          STACK_ENV="dev"
          STACK_DIR="/opt/debridgers/${STACK_ENV}"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${STACK_DIR} /opt/debridgers/cloudflared /opt/debridgers/deploy"

          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/debridgers && tar -xzf /tmp/code.tar.gz && rm -f /tmp/code.tar.gz"

          scp deploy/docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${STACK_DIR}/docker-compose.yml
          scp deploy/docker-compose.tunnel.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.tunnel.yml
          scp deploy/deploy.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

          # Codeberg environment "dev" must hold the test Neon DATABASE_URL in ENV_FILE.
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -eu
            cd ${STACK_DIR}
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo 'incoming env is empty — refusing to replace .env' >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env \".env.bak.\$(date +%s)\"
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          " <<< "$ENV_FILE"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" \
            <<< "$TUNNEL_CREDENTIALS"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin" <<< "$DOCKERHUB_TOKEN"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            IMAGE_SHA='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}'
            IMAGE_BRANCH='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG}'
            docker build --target=prod \
              -t \"\$IMAGE_SHA\" \
              -t \"\$IMAGE_BRANCH\" \
              -f ./docker/backend.Dockerfile .
            chmod +x /opt/debridgers/deploy.sh
            /opt/debridgers/deploy.sh ${SHORT_SHA} ${STACK_ENV}
            docker push \"\$IMAGE_SHA\"
            docker push \"\$IMAGE_BRANCH\""

  deploy-production:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: codeberg-small
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy prod stack to VPS
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_FILE: ${{ secrets.ENV_FILE_PROD }}
          TUNNEL_CREDENTIALS: ${{ secrets.CLOUDFLARE_TUNNEL_CREDENTIALS }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_TAG="latest"
          STACK_ENV="prod"
          STACK_DIR="/opt/debridgers/${STACK_ENV}"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${STACK_DIR} /opt/debridgers/cloudflared /opt/debridgers/deploy"

          tar --exclude=node_modules --exclude=.git --exclude=dist -czf /tmp/code.tar.gz .
          scp /tmp/code.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/code.tar.gz
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/debridgers && tar -xzf /tmp/code.tar.gz && rm -f /tmp/code.tar.gz"

          scp deploy/docker-compose.prod.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${STACK_DIR}/docker-compose.yml
          scp deploy/docker-compose.tunnel.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/docker-compose.tunnel.yml
          scp deploy/deploy.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/deploy.sh
          scp deploy/cloudflared/config.template.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/debridgers/cloudflared/config.template.yml

          # Codeberg environment "production" must hold the live Neon DATABASE_URL in ENV_FILE.
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -eu
            cd ${STACK_DIR}
            cat > .env.incoming
            if [ ! -s .env.incoming ]; then
              echo 'incoming env is empty — refusing to replace .env' >&2
              rm -f .env.incoming
              exit 1
            fi
            if [ -f .env ]; then
              cp -a .env \".env.bak.\$(date +%s)\"
              ls -1t .env.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi
            install -m 600 .env.incoming .env
            rm -f .env.incoming
          " <<< "$ENV_FILE"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > /opt/debridgers/cloudflared/creds.json && chmod 600 /opt/debridgers/cloudflared/creds.json" \
            <<< "$TUNNEL_CREDENTIALS"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin" <<< "$DOCKERHUB_TOKEN"

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "set -eu
            cd /opt/debridgers
            IMAGE_SHA='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}'
            IMAGE_BRANCH='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_TAG}'
            docker build --target=prod \
              -t \"\$IMAGE_SHA\" \
              -t \"\$IMAGE_BRANCH\" \
              -f ./docker/backend.Dockerfile .
            chmod +x /opt/debridgers/deploy.sh
            /opt/debridgers/deploy.sh ${SHORT_SHA} ${STACK_ENV}
            docker push \"\$IMAGE_SHA\"
            docker push \"\$IMAGE_BRANCH\""
